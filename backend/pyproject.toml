[project]
name = "graft-meta-backend"
version = "0.1.0"
description = "Meta-powered source-to-target feature adaptation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.12,<1",
    "httpx>=0.28.1,<0.29",
    "openai>=2,<3",
    "pydantic>=2.11.3,<3",
    "pydantic-settings>=2.9,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.13,<1"]

[project.scripts]
graft-meta-smoke = "app.smoke:main"
graft-crawler-baseline = "app.baseline:main"
graft-pinned-baseline = "app.pinned_baseline:main"
graft-source-trace = "app.source_trace:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "crawler"]
